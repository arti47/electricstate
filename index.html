<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>Electric State Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/barlow-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<a class="skip" href="#screen">Skip to content</a>

<div class="topbar">
<header class="app-header">
  <a class="brand" href="#/home" aria-label="Electric State — home">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">Electric State</span>
  </a>
  <div class="header-actions">
    <button id="trayBtn" class="icon-btn" aria-label="Open the dice tray" title="Dice tray"><span data-icon="dice"></span></button>
    <button id="themeToggle" class="icon-btn" aria-label="Switch theme" title="Switch theme"><span data-icon="theme"></span></button>
    <a id="settingsBtn" class="icon-btn" href="#/settings" aria-label="Settings" title="Settings"><span data-icon="settings"></span></a>
  </div>
</header>

<!-- Persistent resource header: rendered by sheet.js when a Traveler is active -->
<div id="vitals" class="vitals" hidden aria-live="polite"></div>
<!-- A running fight, visible from every screen that is not the tracker itself -->
<a id="strip" class="strip" href="#/combat" hidden></a>
</div>

<main id="screen" class="screen" tabindex="-1"></main>

<aside id="tray" class="tray" hidden aria-label="Dice tray"></aside>

<nav class="tabbar" aria-label="Main">
  <a href="#/home" data-tab="home" aria-current="page"><span data-icon="play"></span>Play</a>
  <a href="#/home" data-tab="traveler"><span data-icon="traveler"></span>Traveler</a>
  <a href="#/dice" data-tab="dice"><span data-icon="dice"></span>Dice</a>
  <a href="#/rules" data-tab="rules"><span data-icon="book"></span>Reference</a>
</nav>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="modalRoot"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
