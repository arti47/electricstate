<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181b">
<title>Electric State Player</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#screen">Skip to content</a>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">Electric State</span>
  </div>
  <div class="header-actions">
    <button id="themeToggle" class="icon-btn" aria-label="Switch theme" title="Switch theme">◐</button>
  </div>
</header>

<!-- Persistent resource header: rendered by sheet.js when a Traveler is active -->
<div id="vitals" class="vitals" hidden aria-live="polite"></div>

<main id="screen" class="screen" tabindex="-1"></main>

<nav class="tabbar" aria-label="Main">
  <a href="#/home" data-tab="home" aria-current="page"><span aria-hidden="true">▣</span>Travelers</a>
  <a href="#/dice" data-tab="dice"><span aria-hidden="true">⚄</span>Dice</a>
  <a href="#/rules" data-tab="rules"><span aria-hidden="true">§</span>Rules</a>
  <a href="#/solo" data-tab="solo" hidden><span aria-hidden="true">♠</span>Solo</a>
  <a href="#/gm" data-tab="gm" hidden><span aria-hidden="true">◈</span>GM</a>
  <a href="#/settings" data-tab="settings"><span aria-hidden="true">⚙</span>Settings</a>
</nav>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="modalRoot"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
